name: Test trackball

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twister:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: config
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install west
        run: python -m pip install west==1.5.0

      - name: Initialize workspace
        run: west init -l config/config workspace

      - name: Update west modules
        working-directory: workspace
        run: west update

      - name: Install ZMK requirements
        working-directory: workspace
        run: python -m pip install -r zmk/app/requirements.txt

      - name: Export Zephyr
        working-directory: workspace
        run: west zephyr-export

      - name: Run trackball Twister tests
        working-directory: workspace
        run: >-
          west twister
          -T modules/pmw3610-driver-minimal/tests/trackball_profile
          -T modules/pmw3610-driver-minimal/tests/trackball_settings
          -T modules/pmw3610-driver-minimal/tests/studio_trackball_settings
          -p native_posix_64
